name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Audit public source files
        run: python3 scripts/release_audit.py
      - name: Synthetic helper tests
        run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Build synthetic tests, host and widget
        run: python3 build.py --ad-hoc
